name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export with Godot 4.3
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          test -f build/Nexo-de-Runas-v2-debug.apk
          ls -lh build/Nexo-de-Runas-v2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-de-Runas-v2-debug
          path: build/Nexo-de-Runas-v2-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Android Debug APK

on:
  push:
    branches:
      - main
      - feat/act1-table
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate + Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project structure
        shell: bash
        run: python tools/validate_project.py

      - name: Check Godot scripts and battle rules
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot-check"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot-check.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot-check.zip" -d "$RUNNER_TEMP/godot-check"
          GODOT_CHECK="$RUNNER_TEMP/godot-check/Godot_v4.3-stable_linux.x86_64"
          "$GODOT_CHECK" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi
          "$GODOT_CHECK" --headless --path . --script tests/battle_test.gd
          "$GODOT_CHECK" --headless --path . --script tests/battle_ui_test.gd 2>&1 | tee "$RUNNER_TEMP/godot-ui.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/godot-ui.log"; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android export dependencies
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Restore permanent Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-de-runas.jks"
          keytool -list -keystore "$RUNNER_TEMP/nexo-de-runas.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          sed -i "s|version/code=.*|version/code=$((1000 + GITHUB_RUN_NUMBER))|" export_presets.cfg
          sed -i "s|version/name=.*|version/name=\"0.2.$GITHUB_RUN_NUMBER\"|" export_presets.cfg
          sed -i "s|keystore/debug=.*|keystore/debug=\"$RUNNER_TEMP/nexo-de-runas.jks\"|" export_presets.cfg
          sed -i "s|keystore/debug_user=.*|keystore/debug_user=\"$ANDROID_KEY_ALIAS\"|" export_presets.cfg
          sed -i "s|keystore/debug_password=.*|keystore/debug_password=\"$ANDROID_KEY_PASSWORD\"|" export_presets.cfg
          sed -i "s|keystore/release=.*|keystore/release=\"$RUNNER_TEMP/nexo-de-runas.jks\"|" export_presets.cfg
          sed -i "s|keystore/release_user=.*|keystore/release_user=\"$ANDROID_KEY_ALIAS\"|" export_presets.cfg
          sed -i "s|keystore/release_password=.*|keystore/release_password=\"$ANDROID_KEY_PASSWORD\"|" export_presets.cfg

      - name: Export with Godot 4.3
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          use_preset_export_path: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-de-Runas-v2-debug
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
